<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malimbe demo - country combobox</title>
<link rel="icon" type="image/png" href="assets/malimbe-favicon-32.png">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; padding: 2rem; }
    main { max-width: 44rem; margin: 0 auto; padding: 2rem; background: #fff; border: 1px solid #d6dce4; border-radius: 0.75rem; }
    h1 { margin-top: 0; }
    p { color: #536174; }
    button { min-height: 2.75rem; margin-top: 1rem; padding: 0.5rem 1rem; border: 2px solid #334155; border-radius: 0.4rem; background: #fff; font: inherit; }
    button:focus-visible { outline: 3px solid #d97706; outline-offset: 2px; }
    @media (max-width: 40rem) { body { padding: 1rem; } main { padding: 1.25rem; } }
  </style>
</head>
<body>
  <main>
    <h1>Choose your country</h1>
    <p>Search the list, then select your country. The selected value is available to the form.</p>
    <form id="country-form">
      <country-combobox name="country" required></country-combobox>
      <button type="submit">Continue</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
  <script type="module">
    import "./country-combobox.js";
    document.querySelector("#country-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      document.querySelector("#result").textContent = `Country code submitted: ${data.get("country") || "none"}.`;
    });
  </script>
</body>
</html>
