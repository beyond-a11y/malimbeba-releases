<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malimbe demo - radio group error handling</title>
<link rel="icon" type="image/png" href="assets/malimbe-favicon-32.png">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #18181b; background: #f4f4f5; }
    body { margin: 0; padding: 2rem; }
    main { max-width: 42rem; margin: 0 auto; padding: 2rem; background: #fff; border: 1px solid #d4d4d8; border-radius: 0.5rem; }
    h1 { margin-top: 0; }
    .intro { color: #52525b; }
    .radio-group { display: grid; gap: 0.75rem; max-width: 32rem; margin: 2rem 0 0; padding: 0; border: 0; }
    .radio-option { display: flex; align-items: flex-start; gap: 0.5rem; }
    .radio-option input { flex: 0 0 auto; margin-top: 0.2rem; }
    .radio-option input:focus-visible { outline: 3px solid #b45309; outline-offset: 3px; }
    .radio-error { margin: 0; color: #991b1b; font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
    button { min-height: 2.75rem; padding: 0.5rem 1rem; border: 2px solid #27272a; border-radius: 0.35rem; background: #27272a; color: #fff; font: inherit; cursor: pointer; }
    button:hover { background: #3f3f46; }
    button.secondary { border-color: #71717a; background: #fff; color: #27272a; }
    button.secondary:hover { background: #f4f4f5; }
    button:focus-visible { outline: 3px solid #b45309; outline-offset: 3px; }
    [hidden] { display: none; }
    #result { margin-bottom: 0; color: #166534; font-weight: 600; }
    @media (forced-colors: active) {
      .radio-option input:focus-visible, button:focus-visible { outline-color: Highlight; }
      .radio-error { color: GrayText; }
    }
    @media (max-width: 40rem) { body { padding: 1rem; } main { padding: 1.25rem; } }
  </style>
</head>
<body>
  <main>
    <h1>Choose a contact method</h1>
    <p class="intro">Submit without choosing an option to see the accessible error state.</p>

    <form id="contact-form" novalidate>
      <fieldset id="contact-group" class="radio-group">
        <legend>Preferred contact method</legend>
        <p id="contact-error" class="radio-error" role="alert" hidden>
          Choose a contact method so we know how to reach you.
        </p>
        <div class="radio-option">
          <input id="contact-email" name="contact" type="radio" value="email">
          <label for="contact-email">Email</label>
        </div>
        <div class="radio-option">
          <input id="contact-phone" name="contact" type="radio" value="phone">
          <label for="contact-phone">Phone</label>
        </div>
      </fieldset>
      <div class="actions">
        <button type="submit">Save preference</button>
        <button id="reset-button" class="secondary" type="button">Reset</button>
      </div>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.querySelector("#contact-form");
    const group = document.querySelector("#contact-group");
    const radios = [...form.querySelectorAll('input[type="radio"]')];
    const error = document.querySelector("#contact-error");
    const result = document.querySelector("#result");
    const resetButton = document.querySelector("#reset-button");

    function setError(hasError) {
      group.toggleAttribute("aria-describedby", hasError);
      if (hasError) group.setAttribute("aria-describedby", error.id);
      radios.forEach((radio) => radio.setAttribute("aria-invalid", String(hasError)));
      error.hidden = !hasError;
    }

    radios.forEach((radio) => radio.addEventListener("change", () => {
      setError(false);
      result.textContent = "";
    }));

    resetButton.addEventListener("click", () => {
      form.reset();
      setError(false);
      result.textContent = "Selection cleared.";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const selected = radios.find((radio) => radio.checked);
      if (!selected) {
        setError(true);
        radios[0].focus();
        return;
      }

      setError(false);
      result.textContent = `Saved: ${selected.value}.`;
    });
  </script>
</body>
</html>
